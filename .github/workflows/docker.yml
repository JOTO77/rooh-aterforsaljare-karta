name: Docker-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    # Imagen byggs och publiceras från det publika repot
    if: github.repository == 'JOTO77/rooh-aterforsaljare-karta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bygg imagen
        run: docker build -t rooh-aterforsaljare .

      - name: Starta och testa containern
        run: |
          docker run -d -p 8080:8080 --name test rooh-aterforsaljare
          for i in $(seq 1 20); do curl -fs http://localhost:8080/halsa && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q "Hitta återförsäljare"
          antal=$(curl -fs http://localhost:8080/aterforsaljare.json | grep -c '"namn"')
          echo "Återförsäljare i containern: $antal"
          test "$antal" -gt 0
          curl -fsI http://localhost:8080/ | grep -i "frame-ancestors"
          docker rm -f test

      - name: Publicera till GitHub Container Registry
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag rooh-aterforsaljare "$IMAGE:latest"
          docker tag rooh-aterforsaljare "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
