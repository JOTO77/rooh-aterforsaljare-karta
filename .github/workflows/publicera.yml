name: Publicera återförsäljarkartan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bygg listan (slår upp nya adresser)
        run: node scripts/bygg.mjs
      - name: Spara nya koordinater i repot
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/geokod-cache.json site/aterforsaljare.json
            git commit -m "Uppdatera koordinater [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
