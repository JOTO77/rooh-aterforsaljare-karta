server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Sidan får bara bäddas in på rooh.se (och i Litiums förhandsvisning)
    add_header Content-Security-Policy "frame-ancestors 'self' https://rooh.se https://*.rooh.se https://*.litium.app" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location = /halsa {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Listan ska alltid vara aktuell
    location = /aterforsaljare.json {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://rooh.se https://*.rooh.se https://*.litium.app" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://rooh.se https://*.rooh.se https://*.litium.app" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
